<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Aloha Creaciones</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root {
        --ink: #221a2e;
        --navy: #114e8a;
        --pink: #e93f7e;
        --yellow: #ffd23f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fdecf3;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .eyebrow {
        display: inline-block;
        margin: 0;
        padding: 0.35rem 0.9rem;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1.25rem 0 0;
        color: var(--navy);
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 1rem auto 0;
        max-width: 32rem;
        color: #6b6373;
        font-size: 1.05rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.85rem 1.6rem;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--pink);
        color: var(--ink);
        font-weight: 800;
        text-decoration: none;
      }
      a:hover {
        background: var(--yellow);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>That page floated away.</h1>
      <p>The link you followed does not exist. Head back home to keep browsing our bouquets and decorations.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
